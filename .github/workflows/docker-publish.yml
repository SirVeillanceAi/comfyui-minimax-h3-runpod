# Builds the image on GitHub's servers and pushes it to your Docker Hub account.
# Needs one repository secret (Settings > Secrets and variables > Actions):
#   DOCKERHUB_TOKEN     a Docker Hub access token (hub.docker.com > Account settings > Personal access tokens)
name: Build and push to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

env:
  IMAGE_NAME: comfyui-minimax-h3
  DOCKERHUB_USER: sirveillanceai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space on the runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short commit id
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
